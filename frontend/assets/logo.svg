<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="voxa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="voxa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="voxa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Fundo sutil do ícone -->
  <rect width="48" height="48" rx="12" fill="#161622" stroke="#222233" stroke-width="1.5"/>
  
  <!-- Símbolo Voxa: Onda sonora + V dinâmico -->
  <g filter="url(#voxa-glow)">
    <!-- Barras de onda sonoras laterais -->
    <rect x="9" y="19" width="3.5" height="10" rx="1.75" fill="url(#voxa-grad)" opacity="0.75" />
    <rect x="15" y="13" width="3.5" height="22" rx="1.75" fill="url(#voxa-grad)" />
    <!-- Onda central em destaque -->
    <rect x="21" y="8" width="3.5" height="32" rx="1.75" fill="url(#voxa-grad)" />
    <rect x="27" y="13" width="3.5" height="22" rx="1.75" fill="url(#voxa-grad)" />
    <rect x="33" y="19" width="3.5" height="10" rx="1.75" fill="url(#voxa-grad)" opacity="0.75" />
    
    <!-- Ponto de pulso de áudio ativo -->
    <circle cx="38" cy="11" r="2.5" fill="url(#voxa-accent)" />
  </g>
</svg>
