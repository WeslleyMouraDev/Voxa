<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxa - Clonagem de Voz, Narração e Transcrição com Legendas Dinâmicas</title>
  <meta name="description" content="Ferramenta local de alta fidelidade para clonagem de voz, geração de narração em PT-BR e criação de legendas SRT dinâmicas sincronizadas." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />

  <!-- Tipografia: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos Globais Dark Premium -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-layout">
    <!-- Sidebar Fixa -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-wrapper">
          <img src="/assets/logo.svg" alt="Voxa Logo" />
        </div>
        <div class="brand-info">
          <span class="brand-name">Voxa</span>
          <span class="badge-lang">PT-BR</span>
        </div>
      </div>

      <!-- Navegação Principal -->
      <nav class="sidebar-nav">
        <a href="#narrate" class="nav-item active" id="nav-narrate">
          <span class="nav-icon">🎙</span>
          <span>Narrar</span>
        </a>
        <a href="#voices" class="nav-item" id="nav-voices">
          <span class="nav-icon">🗣</span>
          <span>Vozes</span>
        </a>
        <a href="#history" class="nav-item" id="nav-history">
          <span class="nav-icon">📋</span>
          <span>Histórico</span>
        </a>
        <a href="#settings" class="nav-item" id="nav-settings">
          <span class="nav-icon">⚙</span>
          <span>Configurações</span>
        </a>
        <a href="#api-docs" class="nav-item" id="nav-api-docs">
          <span class="nav-icon">📚</span>
          <span>API & Docs</span>
        </a>
      </nav>

      <!-- Status do Sistema no Rodapé da Sidebar -->
      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot" id="system-status-dot"></span>
          <div class="status-details">
            <span class="status-label">Status do Sistema</span>
            <span class="status-value" id="system-status-val">Pronto</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Área Principal Dinâmica (SPA) -->
    <main class="main-content" id="main-content" role="main">
      <!-- O conteúdo da página ativa é inserido aqui via JavaScript -->
    </main>
  </div>

  <!-- Botão Flutuante de Toggle do Terminal/Logs -->
  <button id="btn-toggle-logs" class="btn-toggle-logs" title="Abrir painel de logs e terminal em tempo real">
    <span class="log-icon">🖥️</span>
    <span class="log-btn-text">Terminal</span>
    <span id="log-error-badge" class="log-error-badge hidden">0</span>
  </button>

  <!-- Drawer DevTools de Logs e Telemetria -->
  <div id="log-drawer" class="log-drawer collapsed">
    <div class="log-drawer-resize-handle" id="log-drawer-resize-handle"></div>
    <div class="log-drawer-header">
      <div class="log-header-title">
        <span>⚡ Terminal em Tempo Real</span>
        <div class="metrics-badges">
          <span class="metric-badge" id="metric-cpu">CPU: --%</span>
          <span class="metric-badge" id="metric-ram">RAM: -- GB (--%)</span>
        </div>
      </div>
      <div class="log-header-controls">
        <select id="log-level-filter" class="log-select">
          <option value="">Todos os Níveis</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
          <option value="DEBUG">DEBUG</option>
        </select>
        <input type="text" id="log-search-input" class="log-search" placeholder="Filtrar logs..." />
        <button id="btn-autoscroll" class="log-ctrl-btn active" title="Pausar / Retomar Auto-Scroll">⬇ Auto-Scroll</button>
        <button id="btn-clear-logs" class="log-ctrl-btn" title="Limpar logs">🗑️ Limpar</button>
        <button id="btn-close-drawer" class="log-ctrl-btn close-btn" title="Minimizar painel">✕</button>
      </div>
    </div>
    <div class="log-drawer-body" id="log-entries-container">
      <!-- Linhas de logs injetadas dinamicamente -->
    </div>
  </div>

  <!-- Container Global de Toasts -->
  <div id="toast-container"></div>

  <!-- Aplicação Principal (Vanilla JS ES Module) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
